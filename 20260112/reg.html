<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>
    <hr>

    <form action="submit_registration" method="post">

        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" required><br><br>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" required><br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>

            <label for="gender">Gender:</label><br>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label><br>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label><br>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label><br><br>
        </fieldset>

        <!-- Contact Information -->
        <fieldset>
            <legend>Contact Information</legend>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required><br><br>

            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="40"></textarea><br><br>
        </fieldset>

        <!-- Academic Information -->
        <fieldset>
            <legend>Academic Information</legend>

            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="">--Choose a Course--</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Physics">Physics</option>
                <option value="Chemistry">Chemistry</option>
                <option value="Biology">Biology</option>
            </select><br><br>

            <label for="year">Year of Study:</label>
            <input type="number" id="year" name="year" min="1" max="5" required><br><br>

            <label for="skills">Skills / Interests:</label><br>
            <input type="checkbox" id="coding" name="skills" value="Coding">
            <label for="coding">Coding</label><br>
            <input type="checkbox" id="sports" name="skills" value="Sports">
            <label for="sports">Sports</label><br>
            <input type="checkbox" id="music" name="skills" value="Music">
            <label for="music">Music</label><br>
            <input type="checkbox" id="arts" name="skills" value="Arts">
            <label for="arts">Arts</label><br><br>
        </fieldset>

        <!-- File Upload -->
        <fieldset>
            <legend>Upload Documents</legend>
            <label for="photo">Upload Photo:</label>
            <input type="file" id="photo" name="photo" accept="image/*"><br><br>

            <label for="marksheet">Upload Marksheet:</label>
            <input type="file" id="marksheet" name="marksheet" accept=".pdf,.doc,.docx"><br><br>
        </fieldset>

        <!-- Submit and Reset -->
        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">

    </form>

</body>
</html>
